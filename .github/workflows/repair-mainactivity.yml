name: Repair MainActivity

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix drawer scrolling without replacing current UI
        run: |
          set -euo pipefail
          sed -i 's/^[[:space:]]*fillViewport = true$/            setFillViewport(true)/' app/src/main/java/tw/v2scanner/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/tw/v2scanner/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import android.graphics.Color\n', 'import android.graphics.Color\nimport android.graphics.Rect\n')
          s = s.replace('    private lateinit var drawer: View\n', '    private lateinit var drawer: View\n    private var drawerScroll: ScrollView? = null\n')
          s = s.replace('        scheduleBox.addView(scheduleTimes, editParams())\n', '''        scheduleBox.addView(scheduleTimes, editParams())
        scheduleTimes.setOnFocusChangeListener { view, hasFocus ->
            if (hasFocus) {
                view.postDelayed({
                    drawerScroll?.requestChildRectangleOnScreen(
                        view,
                        Rect(0, 0, view.width, view.height),
                        true
                    )
                }, 250)
            }
        }
        scheduleTimes.setOnClickListener {
            it.postDelayed({
                drawerScroll?.requestChildRectangleOnScreen(
                    it,
                    Rect(0, 0, it.width, it.height),
                    true
                )
            }, 150)
        }
''')
          s = s.replace('        return ScrollView(this).apply {\n            isVerticalScrollBarEnabled = false\n', '        return ScrollView(this).apply {\n            drawerScroll = this\n            isVerticalScrollBarEnabled = false\n')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/tw/v2scanner/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix drawer scrolling when keyboard is open'
          git push origin HEAD:main
