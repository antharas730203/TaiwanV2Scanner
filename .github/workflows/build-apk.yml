name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore signing keystore
        env:
          KS1: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SP1: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KA1: ${{ secrets.SIGNING_KEY_ALIAS }}
          KP1: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KS2: ${{ secrets.KEYSTORE_BASE64 }}
          SP2: ${{ secrets.KEYSTORE_PASSWORD }}
          KA2: ${{ secrets.KEY_ALIAS }}
          KP2: ${{ secrets.KEY_PASSWORD }}
          KS3: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP3: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA3: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP3: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          found=0
          rm -f signing.jks keystore.properties probe.jar probe-signed.jar
          mkdir -p signing-probe
          printf 'probe' > signing-probe/probe.txt
          (cd signing-probe && zip -q ../probe.jar probe.txt)

          for i in 1 2 3; do
            ks_var="KS$i"
            sp_var="SP$i"
            ka_var="KA$i"
            kp_var="KP$i"
            ks="${!ks_var:-}"
            sp="${!sp_var:-}"
            ka="${!ka_var:-}"
            kp="${!kp_var:-}"
            [ -n "$ks" ] || continue
            [ -n "$sp" ] || continue
            [ -n "$ka" ] || continue
            [ -n "$kp" ] || continue

            candidate="candidate-$i.jks"
            rm -f "$candidate" probe-signed.jar
            if ! printf '%s' "$ks" | base64 --decode > "$candidate" 2>/dev/null; then
              continue
            fi
            if ! keytool -list -keystore "$candidate" -storepass "$sp" -alias "$ka" >/dev/null 2>&1; then
              continue
            fi
            if ! jarsigner -keystore "$candidate" -storepass "$sp" -keypass "$kp" -signedjar probe-signed.jar probe.jar "$ka" >/dev/null 2>&1; then
              continue
            fi

            cp "$candidate" signing.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$GITHUB_WORKSPACE/signing.jks" "$sp" "$ka" "$kp" > keystore.properties
            echo "Compatible signing credentials found."
            found=1
            break
          done

          rm -rf signing-probe candidate-1.jks candidate-2.jks candidate-3.jks probe.jar probe-signed.jar
          if [ "$found" -ne 1 ]; then
            echo "No compatible signing credential set was found. The keystore/password/alias/key-password secrets do not match."
            exit 1
          fi

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Verify APK version
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "Built APK: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='tw.v2scanner' versionCode='17' versionName='0.8.2'"

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaiwanV2Scanner-v${{ steps.version.outputs.version }}-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
