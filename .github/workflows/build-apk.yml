name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.6.9 cleanup and batch logic
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/tw/v2scanner/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace('    private lateinit var autoChatGPTShare: CheckBox\n', '')
          s = s.replace('    private lateinit var testGitHub: Button\n', '')
          s = re.sub(r'\n\s*autoChatGPTShare = CheckBox\(this\)\.apply \{.*?\n\s*\}\n', '\n', s, flags=re.S)
          s = s.replace('        config.addView(autoChatGPTShare)\n', '')
          s = s.replace('                    .putBoolean("auto_chatgpt_share", autoChatGPTShare.isChecked)\n', '')
          s = re.sub(r'\n\s*if \(prefs\.getBoolean\("auto_chatgpt_share", false\)\) \{\n\s*shareLastJson\(\)\n\s*\}\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*val row2 = buttonRow\(\)\n\s*testGitHub = actionButton\("測試 GitHub 上傳 JSON"\).*?actionGrid\.addView\(row2\)\n', '\n        val row2 = buttonRow()\n        row2.addView(verifyGitHub, buttonWeightParams())\n        actionGrid.addView(row2)\n', s, flags=re.S)
          s = re.sub(r'\n\s*testGitHub\.setOnClickListener \{.*?\n\s*\}\n\n\s*verifyGitHub\.setOnClickListener', '\n\n        verifyGitHub.setOnClickListener', s, flags=re.S)
          s = s.replace('台股 V2 掃描器 V0.6.8', '台股 V2 掃描器 V0.6.9')
          s = s.replace('TaiwanV2Scanner/0.6.8', 'TaiwanV2Scanner/0.6.9')
          p.write_text(s, encoding="utf-8")

          scanner = Path("app/src/main/java/tw/v2scanner/ScannerCore.kt")
          s = scanner.read_text(encoding="utf-8")
          needle = '            ScanPersistence.saveResult(context, json, csv, stamp)\n'
          if 'BatchExporter.export(context, stamp, json)' not in s:
              if needle not in s:
                  raise SystemExit('ScanPersistence hook not found')
              s = s.replace(needle, needle + '            val batches = BatchExporter.export(context, stamp, json)\n', 1)
          s = s.replace('                .putInt("last_final_batch", result.finalBatchSize)\n', '                .putInt("last_final_batch", result.finalBatchSize)\n                .putInt("last_safe_batch_count", batches.count)\n                .putInt("last_safe_batch_max_chars", batches.maxChars)\n')
          s = s.replace('            "完整市場掃描\\n上市：${result.markets.first { it.market == "TWSE" }.codes.size} 檔｜上櫃：${result.markets.first { it.market == "TPEX" }.codes.size} 檔\\n全市場：${result.expected} 檔\\n', '            "完整市場掃描\\n上市：${result.markets.first { it.market == "TWSE" }.codes.size} 檔｜上櫃：${result.markets.first { it.market == "TPEX" }.codes.size} 檔\\n全市場：${result.expected} 檔\\n安全批次：${batches.count} 批｜每批 ≤ ${BatchExporter.CHAR_LIMIT} 字元\\n')
          scanner.write_text(s, encoding="utf-8")
          PY

          cat > app/src/main/java/tw/v2scanner/BatchExporter.kt <<'KOT'
package tw.v2scanner

import android.content.Context
import org.json.JSONArray
import org.json.JSONObject
import java.io.File

object BatchExporter {
    const val CHAR_LIMIT = 6000

    data class ExportResult(val count: Int, val directory: File, val maxChars: Int)

    fun export(context: Context, stamp: String, fullJson: String): ExportResult {
        val root = JSONObject(fullJson)
        val stocks = root.optJSONArray("stocks") ?: JSONArray()
        val dir = File(context.getExternalFilesDir(null), "scanner_batches/$stamp")
        if (dir.exists()) dir.deleteRecursively()
        dir.mkdirs()

        val index = JSONArray()
        var current = JSONArray()
        var batchNo = 1
        var maxChars = 0

        fun buildText(batch: JSONArray, number: Int): String {
            val first = batch.optJSONObject(0)?.optString("c").orEmpty()
            val last = batch.optJSONObject(batch.length() - 1)?.optString("c").orEmpty()
            return JSONObject().apply {
                put("scan_time", root.optString("scan_time", stamp))
                put("mode", root.optString("mode", "FULL"))
                put("batch", number)
                put("stock_start", first)
                put("stock_end", last)
                put("stock_count", batch.length())
                put("char_limit", CHAR_LIMIT)
                put("stocks", batch)
            }.toString()
        }

        fun flush() {
            if (current.length() == 0) return
            val text = buildText(current, batchNo)
            require(text.length <= CHAR_LIMIT) { "Batch $batchNo 超過 ${CHAR_LIMIT} 字元：${text.length}" }
            File(dir, "batch_%03d.json".format(batchNo)).writeText(text, Charsets.UTF_8)
            index.put(JSONObject().apply {
                put("batch", batchNo)
                put("stock_start", current.optJSONObject(0)?.optString("c").orEmpty())
                put("stock_end", current.optJSONObject(current.length() - 1)?.optString("c").orEmpty())
                put("stock_count", current.length())
                put("characters", text.length)
                put("file", "batch_%03d.json".format(batchNo))
            })
            maxChars = maxOf(maxChars, text.length)
            current = JSONArray()
            batchNo++
        }

        for (i in 0 until stocks.length()) {
            val stock = stocks.optJSONObject(i) ?: continue
            val candidate = JSONArray()
            for (j in 0 until current.length()) candidate.put(current.getJSONObject(j))
            candidate.put(stock)
            if (current.length() > 0 && buildText(candidate, batchNo).length > CHAR_LIMIT) flush()
            current.put(stock)
        }
        flush()

        val indexRoot = JSONObject().apply {
            put("scan_time", root.optString("scan_time", stamp))
            put("mode", root.optString("mode", "FULL"))
            put("char_limit", CHAR_LIMIT)
            put("stock_count", stocks.length())
            put("batch_count", index.length())
            put("max_batch_characters", maxChars)
            put("batches", index)
        }
        File(dir, "batch_index.json").writeText(indexRoot.toString(), Charsets.UTF_8)
        return ExportResult(index.length(), dir, maxChars)
    }
}
KOT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/src/main/java/tw/v2scanner/MainActivity.kt app/src/main/java/tw/v2scanner/ScannerCore.kt app/src/main/java/tw/v2scanner/BatchExporter.kt
            git commit -m "feat: add atomic 6000-char JSON batches and remove temporary ChatGPT test"
            git push
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TaiwanV2Scanner-v0.6.9-debug
          path: app/build/outputs/apk/debug/app-debug.apk
