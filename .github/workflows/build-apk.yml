name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.6.9 source changes
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          p = Path("app/src/main/java/tw/v2scanner/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace('    private lateinit var autoChatGPTShare: CheckBox\n', '')
          s = s.replace('    private lateinit var testGitHub: Button\n', '')
          s = re.sub(r'\n\s*autoChatGPTShare = CheckBox\(this\)\.apply \{.*?\n\s*\}\n', '\n', s, flags=re.S)
          s = s.replace('        config.addView(autoChatGPTShare)\n', '')
          s = s.replace('                    .putBoolean("auto_chatgpt_share", autoChatGPTShare.isChecked)\n', '')
          s = re.sub(r'\n\s*if \(prefs\.getBoolean\("auto_chatgpt_share", false\)\) \{\n\s*shareLastJson\(\)\n\s*\}\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*val row2 = buttonRow\(\)\n\s*testGitHub = actionButton\("測試 GitHub 上傳 JSON"\).*?actionGrid\.addView\(row2\)\n', '\n        val row2 = buttonRow()\n        row2.addView(verifyGitHub, buttonWeightParams())\n        actionGrid.addView(row2)\n', s, flags=re.S)
          s = re.sub(r'\n\s*testGitHub\.setOnClickListener \{.*?\n\s*\}\n\n\s*verifyGitHub\.setOnClickListener', '\n\n        verifyGitHub.setOnClickListener', s, flags=re.S)
          s = s.replace('台股 V2 掃描器 V0.6.8', '台股 V2 掃描器 V0.6.9')
          s = s.replace('TaiwanV2Scanner/0.6.8', 'TaiwanV2Scanner/0.6.9')
          p.write_text(s, encoding="utf-8")

          batch_b64 = ""
          Path("app/src/main/java/tw/v2scanner/BatchExporter.kt").write_bytes(base64.b64decode(batch_b64))

          scanner = Path("app/src/main/java/tw/v2scanner/ScannerCore.kt")
          s = scanner.read_text(encoding="utf-8")
          needle = '            ScanPersistence.saveResult(context, json, csv, stamp)\n'
          if 'BatchExporter.export(context, stamp, json)' not in s:
              if needle not in s:
                  raise SystemExit('ScanPersistence hook not found')
              s = s.replace(needle, needle + '            val batches = BatchExporter.export(context, stamp, json)\n', 1)
          s = s.replace('                .putInt("last_final_batch", result.finalBatchSize)\n', '                .putInt("last_final_batch", result.finalBatchSize)\n                .putInt("last_safe_batch_count", batches.count)\n                .putInt("last_safe_batch_max_chars", batches.maxChars)\n')
          scanner.write_text(s, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/tw/v2scanner/MainActivity.kt app/src/main/java/tw/v2scanner/ScannerCore.kt app/src/main/java/tw/v2scanner/BatchExporter.kt
          if ! git diff --cached --quiet; then
            git commit -m "feat: v0.6.9 atomic 6000-char batches [skip ci]"
            git push
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build v0.6.9 APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaiwanV2Scanner-v0.6.9-debug
          path: app/build/outputs/apk/debug/*.apk
