name: Repair diagnostics UI

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'Repair diagnostics UI from previous MainActivity source' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous MainActivity
        run: git checkout HEAD^ -- app/src/main/java/tw/v2scanner/MainActivity.kt
      - name: Patch diagnostics UI
        run: python3 tools/repair_diagnostics_ui.py
      - name: Commit repaired file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/tw/v2scanner/MainActivity.kt
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair diagnostics UI from previous MainActivity source"
          git push
